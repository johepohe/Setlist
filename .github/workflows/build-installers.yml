name: Build installers

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Setlist-linux-x86_64
            command: bash scripts/build_linux.sh
            path: dist/Setlist-linux-x86_64.tar.gz
          - os: windows-latest
            artifact: Setlist-windows-x64
            command: powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1
            path: dist/Setlist-windows-x64.zip
          - os: macos-latest
            artifact: Setlist-macos
            command: bash scripts/build_macos.sh
            path: dist/Setlist-macos.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
