name: Build installers

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep Linux on an older, fixed runner. PyInstaller Linux binaries
          # require at least the glibc version of the machine they are built on.
          # Ubuntu 22.04 uses glibc 2.35 and therefore also runs on Debian 12 /
          # MX Linux 23 (glibc 2.36). Do not change this to ubuntu-latest.
          - os: ubuntu-22.04
            artifact: Setlist-linux-x86_64
            command: bash scripts/build_linux.sh
            path: dist/Setlist-linux-x86_64.tar.gz
          - os: windows-latest
            artifact: Setlist-windows-x64
            command: powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1
            path: dist/Setlist-windows-x64.zip
          - os: macos-latest
            artifact: Setlist-macos
            command: bash scripts/build_macos.sh
            path: dist/Setlist-macos.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Python 3.11 is supported by Ubuntu 22.04 and by all dependencies,
          # while still accepting the type syntax used by Setlist.
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
